---
# This Docker composition file is used to build and test the container

name: gatherer

secrets:
  database_creds:
    file: ./src/secrets/database_creds.yml

services:
  gatherer:
    # Run the container normally
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    image: cisagov/gatherer
    init: true
    restart: "no"
    secrets:
      - source: database_creds
        target: database_creds.yml
  redis:
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    image: redis:alpine
